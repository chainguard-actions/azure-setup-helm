name: Test checksum-policy required
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: v3.15.4
          checksum-policy: required
      - name: Assert installed with verified checksum
        env:
          HELM_PATH: ${{ steps.action.outputs.helm-path }}
        run: |
          echo "helm-path: $HELM_PATH"
          if [ -z "$HELM_PATH" ] || [ ! -x "$HELM_PATH" ]; then
            echo "FAIL: helm-path missing or not executable"
            exit 1
          fi
          V="$("$HELM_PATH" version --short)"
          echo "version: $V"
          case "$V" in
            v3.15.4*) echo "PASS" ;;
            *) echo "FAIL: expected v3.15.4"; exit 1 ;;
          esac
