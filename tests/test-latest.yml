name: Test latest version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert some helm installed
        env:
          HELM_PATH: ${{ steps.action.outputs.helm-path }}
        run: |
          echo "helm-path: $HELM_PATH"
          if [ -z "$HELM_PATH" ] || [ ! -x "$HELM_PATH" ]; then
            echo "FAIL: helm-path missing or not executable"
            exit 1
          fi
          V="$("$HELM_PATH" version --short)"
          echo "version: $V"
          if ! echo "$V" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "FAIL: unexpected version string"
            exit 1
          fi
          echo "PASS"
