name: Test helm installer - specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-helm
        uses: .
        with:
          version: v3.12.0
      - name: Assert helm-path output is set
        env:
          HELM_PATH: ${{ steps.setup-helm.outputs.helm-path }}
        run: |
          echo "helm-path: $HELM_PATH"
          if [ -z "$HELM_PATH" ]; then
            echo "FAIL: helm-path output is empty"
            exit 1
          fi
          echo "PASS: helm-path is set to $HELM_PATH"
      - name: Assert helm binary exists at output path
        env:
          HELM_PATH: ${{ steps.setup-helm.outputs.helm-path }}
        run: |
          echo "Checking helm binary at: $HELM_PATH"
          if [ ! -f "$HELM_PATH" ]; then
            echo "FAIL: helm binary not found at $HELM_PATH"
            exit 1
          fi
          echo "PASS: helm binary exists at $HELM_PATH"
      - name: Assert installed helm version matches requested version
        run: |
          INSTALLED_VERSION=$(helm version --short 2>/dev/null || helm version --template '{{.Version}}' 2>/dev/null)
          echo "Installed version: $INSTALLED_VERSION"
          if echo "$INSTALLED_VERSION" | grep -q "v3.12.0"; then
            echo "PASS: helm version v3.12.0 is installed"
          else
            echo "FAIL: expected v3.12.0 but got $INSTALLED_VERSION"
            exit 1
          fi
