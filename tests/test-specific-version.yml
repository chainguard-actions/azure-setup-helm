name: Test specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: v3.14.0
      - name: Assert helm-path output and installed version
        env:
          HELM_PATH: ${{ steps.action.outputs.helm-path }}
        run: |
          echo "helm-path: $HELM_PATH"
          if [ -z "$HELM_PATH" ]; then
            echo "FAIL: helm-path output empty"
            exit 1
          fi
          if [ ! -x "$HELM_PATH" ]; then
            echo "FAIL: helm-path is not an executable file"
            exit 1
          fi
          V="$("$HELM_PATH" version --short)"
          echo "version: $V"
          case "$V" in
            v3.14.0*) echo "PASS: helm-path version ok" ;;
            *) echo "FAIL: expected v3.14.0"; exit 1 ;;
          esac
          PV="$(helm version --short)"
          echo "PATH helm version: $PV"
          case "$PV" in
            v3.14.0*) echo "PASS: helm on PATH" ;;
            *) echo "FAIL: helm on PATH is not v3.14.0"; exit 1 ;;
          esac
